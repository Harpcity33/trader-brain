[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-brain"
version = "2.0.0"
description = "Fail-closed persistent equity lifecycle and research policy for Titan Momentum"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
titan-full-live = "titan_brain.live.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

prompt = '''
Operate the existing Robinhood Titan heartbeat as LIVE ATTENDED COMPATIBILITY mode under strategy titan_live_attended_compat_premarket_2026-08-27_v2 for account ending 7153. This is a real-money live desk, but this prompt alone never authorizes an order mutation.

Run every minute on valid U.S. trading weekdays from 07:00 through 15:59 America/New_York. Treat 07:00-09:30 as the attended premarket lane and 09:30-16:00 as the regular-hours lane. On market holidays or unexpected closures, reconcile only as needed and return DONT_NOTIFY unless an exact attended buy or sell review is required.

1. Reconcile Robinhood first: account state, cash, unleveraged buying power, positions, equity orders, option positions and orders, today's realized P&L, and every pending, partial, canceled, rejected, failed, voided, pending-cancelled, partially-filled-rest-cancelled, locating, locate-failed, or unknown broker state. Robinhood is authoritative.
2. Manage unresolved exposure or orders before discovery. Never infer a fill, retry an unknown submission, overlap exits, or report flatness without strictly newer broker evidence.
3. Scan the broad live U.S. equity mover universe using Massive and Robinhood scanner, quote, price-book, tradability, and completed-bar evidence. Rank by trade quality rather than raw percentage gain. Require a causal completed-bar structure, fresh executable quotes, acceptable spread and displayed depth, current session tradability, remaining capacity, acceptable extension, structural invalidation, targets, and favorable reward/risk.
4. Allowed instruments only: exchange-listed Robinhood-tradeable long equity, price strictly above $5, whole shares, no margin or debit, no options, shorting, fractional shares, ADD, reentry, averaging down, stop widening, or overnight exposure.
5. PREMARKET ENTRY LANE: 07:00-09:25 America/New_York only. BUY LIMIT, time_in_force=gfd, market_hours=extended_hours. Require get_equity_tradability evidence that the exact symbol is eligible for extended hours, fresh premarket bid/ask and depth, adequate liquidity, and an exact Robinhood review. No market, stop, stop-limit, fractional, dollar-based, or queued regular-hours entry orders. Do not open a new position from 09:25-09:35 while reconciling the session transition.
6. Premarket protection limitation: Robinhood stop and stop-limit orders are regular-hours-only and do not protect a premarket fill before 09:30. A premarket entry is viable only when the user is present and explicitly accepts this limitation in the exact buy review, can remain through conclusive fill or cancel reconciliation, and can attend any required extended-hours SELL LIMIT exit review. Keep premarket risk materially smaller than regular-hours risk and size it to the structural invalidation plus a positive liquidity/slippage reserve. After each confirmed premarket fill delta, immediately prepare the exact regular-hours GTC sell stop-market review for protection beginning at the regular open, while continuously monitoring for an attended extended-hours sell-limit exit if invalidation occurs before 09:30. Never imply native premarket stop protection exists.
7. REGULAR-HOURS ENTRY LANE: 09:35-15:30 America/New_York only. BUY LIMIT, whole shares, market_hours=regular_hours. After every confirmed fill delta, immediately review the exact GTC regular-hours sell stop-market at the predeclared structural stop, display it, obtain the connector-required explicit confirmation, place it only after that confirmation, and verify its working quantity. If protection fails, obtain a reviewed and confirmed safe close.
8. Enforce an irreversible account-day new-entry lock at broker-confirmed realized P&L of -$100 or lower. New stop-defined downside plus open and pending downside and a positive execution reserve must fit remaining headroom. The +$150 daily profit goal is aspirational, not guaranteed, and not a ceiling. After the first broker-confirmed +$150 crossing, new risk must preserve at least +$125. Never manufacture a trade to hit the goal.
9. For any qualifying entry or exit, refresh account, position, order, quote, depth, and session-tradability evidence. Call Robinhood review_equity_order for the exact tuple and correct market_hours. Display the complete preview, every alert, order_checks, disclosure, expiry, the predeclared invalidation, and the exact confirmation phrase. Do not call place_equity_order until the user explicitly confirms that immediately preceding, unexpired exact review. Any tuple, evidence, session tag, or expiry change requires a fresh review and confirmation. Every cancel, replacement, discretionary exit, mandatory exit, and protection order requires its own exact review and confirmation. Never retry an unknown submission.
10. Stop new entries at 15:30. Begin closeout preparation at 15:50 and require broker-confirmed standard-equity flatness by 15:55. No after-hours entries and no overnight exposure.
11. NOTIFICATION POLICY — BUY/SELL REVIEWS ONLY. Continue reconciliation, exposure management, scanning, risk controls, and closeout checks on every heartbeat, but return DONT_NOTIFY for routine scans, watchlists, flat or unchanged state, time/cash/risk summaries, non-actionable candidates, ordinary completed fills or cancels that need no further approval, and NO TRADE outcomes.
12. Return NOTIFY only when an exact, current Robinhood BUY REVIEW REQUIRED or SELL / EXIT REVIEW REQUIRED is ready and awaiting the user's explicit confirmation. Put that requirement first and show the complete preview, every alert, order_checks, disclosure, expiry, session tag, and exact confirmation phrase. Urgent unresolved or unprotected live exposure may notify only by producing the exact required SELL / EXIT REVIEW REQUIRED flow. Never imply that a watchlist item is approved to buy, and never mutate an order without its required exact attended confirmation.

This compatibility lane uses only the currently connected Massive and Robinhood tools and Robinhood's native attended approval flow. It does not claim atomic bracket/OCO protection, unattended premarket or regular-hours protection, whole-broker advanced-order reconciliation, or a guaranteed profit or loss outcome.
'''

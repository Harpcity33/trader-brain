CORE, RUNNER, ADDS, REENTRY, AND ROTATION
- Treat +1R, +2R, and +3R as T1, T2, and T3 reference levels for measurement and review, not forced exits, target orders, score ceilings, or proof that remaining opportunity is exhausted.
- At +1R, do not automatically trim or move protection to exact breakeven inside normal noise. Raise protection only beneath a valid higher low, accepted breakout retest, VWAP structure, or volatility-adjusted invalidation.
- Manage a winning position as a core plus a 20%-30% runner when quantity permits. At or beyond +2R: a dominant expanding leader may trim 0%-15%; a healthy leader may realize 25%-33%; an extended or vulnerable leader may realize about 50%. Retain the runner unless a hard invalidation, failed protection, closeout, or confirmed failure requires exit. Resize protection immediately after every partial.
- Press winners only through profitable, open-risk-neutral or profit-funded adds after a controlled retest or materially new base. Stop adding when parabolic, liquidity deteriorates, progress fails despite record volume, or the risk campaign reaches its permitted limit.
- Permit prompt reentry after a false stop only when price rapidly reclaims the failed level and completes a clean retest. Otherwise require a materially new five-minute base and a new documented thesis. There is no arbitrary clock cooldown, but never keep one open position plus a competing active entry intent for the same symbol.
- Rotate capital when an existing core becomes vulnerable or has clearly lower executable remaining opportunity than a new leader: realize the depleted core, retain a protected runner only if structure remains valid, and redeploy solely when the new candidate passes every gate and aggregate downside still fits.

CONTINUATION AND EXIT LOGIC
- Re-evaluate each position every wake using price structure, VWAP and opening-range control, volume participation, price progress, spread and depth, catalyst integrity when present, sector or market context, extension, and remaining opportunity. Numeric scores and labels assist comparison; they are not standalone hold or exit commands.

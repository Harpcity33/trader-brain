CAUSAL TRIGGER AND EXECUTION GATES
- Require an exact, contemporaneous, auditable directional trigger. For an initial entry—which may be the full dynamically authorized size and need not be a small probe—require at least one completed holding, higher-support, or clean-retest bar plus two independent positive observations among price acceleration, volume acceleration, same-time-of-day relative volume, and sector or market confirmation; at least one must be price or volume behavior.
- For a normal build require a profitable thesis plus a completed controlled base, higher low, or five-minute retest with renewed price acceptance and expanding volume pace. Never add to a losing, weakened, overextended, or exhausted thesis.
- Require a current Massive NBBO no more than 15 seconds old and a fresh Robinhood quote and Level 2 check. Reject an entry when the sources materially disagree, quotes are crossed or stale, depth is unreliable, or spread exceeds both the instrument's absolute lane rule and 15% of entry-to-structural-stop distance.
- Require price inside the reviewed limit and no more than 0.625 short ATR beyond the planned trigger. Reject an unresolved halt, exhaustion lock, nonpositive structural risk distance, failed VWAP or support acceptance, evaporating bids, or an entry that cannot be protected.
- Use limit entries. After Robinhood review, if price moves beyond the reviewed limit but remains inside the chase ceiling, perform one immediate quote refresh and new review. Otherwise abandon the attempt and rearm only after materially new structure.
- After submission, poll and reconcile until filled, canceled, rejected, or expired. A preview is not an order. Record a fill only when Robinhood confirms it.
- Start the exact 10-second broker-acknowledgment deadline from the durable `submission_intent_at` written immediately before the broker call; `broker_ack_deadline_at` must equal `submission_intent_at + 10 seconds`, never the broker receipt time or a later polling time. A valid acknowledgment requires Robinhood to return a durable broker order identifier, broker receipt timestamp, and acknowledged status for the exact reviewed account, instrument, side, quantity, and limit. If complete acknowledgment is absent by that immutable deadline, keep the already-recorded submission intent in `SUBMISSION_UNKNOWN`, classify the broker acknowledgment `BROKER_ACK_UNKNOWN`, alert the user, suspend every new ENTRY, ADD, and reentry, and reconcile Robinhood orders and positions until the original request is conclusively found or ruled out. Never infer rejection from silence, resubmit, or create a duplicate order. The acknowledgment is not a fill and does not replace fill or protection confirmation.
- Promptly place broker-held full-quantity GTC stop-market protection at the structural invalidation after every regular-hours fill. Verify acceptance and quantity. If protection cannot be accepted promptly, attempt a reviewed safe close. Never place overlapping full-quantity exits; reconcile the existing order before replacement.

PREMARKET EQUITY LANE
- Premarket entries are allowed 7:05-9:20 AM only for exchange-listed, extended-hours-eligible equities or ETFs above $5. No options, under-$5 names, warrants, acquisition vehicles, recent unresolved volatility-halt names, or symbols with adverse security-status evidence.
- Before the lane opens, require two consecutive healthy one-minute account, order, quote, and scanner checks. Authentication, stale-state, connector, or protection-workflow uncertainty closes the lane to new entries.
- Require improving price and volume evidence, completed support or retest structure, spread no greater than 0.3125%, displayed depth at least 15 times intended size, premarket dollar volume at least $7.5 million, price no more than 1.875 short ATR beyond trigger and 5 short ATR from extended-hours VWAP, and an executable whole-share limit order.
- Premarket entry has no fixed dollar campaign cap: its notional may range from a small probe through the maximum allowed by the dynamic stop-risk rule below, current unleveraged buying power, displayed depth, and extended-hours escape liquidity. Do not add before regular hours. Hold only as many premarket positions as can each be reviewed and manually exited on every one-minute wake while their combined downside and premarket execution reserve fit current account loss headroom.
- Before entry define the immediate marketable sell-limit escape and intended 9:30 protection. Exit on structural failure, stale data, spread above 0.75%, material liquidity deterioration, missed monitoring, or authentication loss. Normally close by 9:28; carry through the open only when structure remains dominant and immediately verify full-quantity broker stop protection at 9:30.

UNDER-$5 EQUITY LANE
- Only exchange-listed $1-$5 equities; never OTC. Fresh news is not mandatory, but current reverse-split, listing, filing, financing, dilution, promotion, manipulation, and security-status checks must show no confirmed adverse or unresolved critical condition.
- Require a causal breakout, reclaim, or first controlled pullback; TIGHT_BASE by itself is insufficient. Require Level 2, spread no greater than 0.9375%, displayed depth at least 7.5 times intended order, and regular-session dollar volume at least $7.5 million.
- After a volatility halt, wait for at least two completed post-resumption bars to establish new executable structure. There is no fixed $15, $20, $22.50, or $30 campaign-loss ceiling; size under-$5 exposure under the same dynamic stop-risk rule, actual unleveraged buying power, stricter depth and spread gates, halt/gap tail reserve, and current loss headroom. Whole-share limit entries and immediate full-quantity protection are mandatory.

OPTIONS LANE
- Single-leg long calls or puts only, normally 6-57 DTE and preferably 6-27 DTE. The underlying must independently qualify. Prefer ATM or near-ATM contracts; never use far-OTM lottery contracts.
- Query the exact current chain, contract terms, two-sided quote, spread, volume, open interest when available, and contract history. Never infer an option price from the underlying.
- Require spread no greater than 10% of midpoint and $0.125, or no greater than 6.25% for higher-premium contracts, plus sufficient depth for one contract. Buy-to-open with a limit order and promptly protect the fill with a full-quantity GTC sell-to-close stop-market order.
- Planned stop loss must fit the dynamic stop-risk rule and remaining account loss headroom; the full debit must also fit actual unleveraged buying power and the conservative tail-loss assessment. Because an option can lose much or all of its debit before a stop executes, do not equate debit deployed with stop-defined loss or concentrate an option beyond what the tail-loss assessment and remaining loss headroom support. Skip the trade when the smallest contract cannot fit. Never hold through earnings, expiration, or overnight, and never exercise.

RISK CAMPAIGNS AND CONCURRENCY
- Define `START_OF_DAY_EQUITY` once from the first fresh broker-confirmed total-equity snapshot obtained before the session's first fill. Never reset it intraday. Adjust only for a broker-confirmed nontrading cash flow. If the baseline or current equity is unreadable, suspend new entries.
- Define `ACCOUNT_DAY_PNL` as current broker-confirmed total account equity minus START_OF_DAY_EQUITY, adjusted only for confirmed nontrading cash flow. Track broker-confirmed realized net P&L separately. Define `LOSS_GAUGE` as the lesser of ACCOUNT_DAY_PNL and realized net P&L so unrealized gains cannot conceal realized losses and unrealized losses cannot be ignored.
- A risk campaign is one current symbol and directional thesis. `NOTIONAL` is the cash value deployed at the reviewed entry; `STOP_DEFINED_RISK` is the loss from the worst reviewed executable entry to the exact structural stop for the full quantity, before any hoped-for profit. They are different controls: a tight, liquid setup may deploy up to 100% of actual account equity or unleveraged buying power while its stop-defined loss remains a much smaller amount that fits the fixed day-loss boundary. Full-account notional never authorizes risking the account balance.
- Define `REMAINING_LOSS_HEADROOM = max(0, LOSS_GAUGE + $100)`. For the exact pre-order check, define `EXISTING_OPEN_DOWNSIDE` as the aggregate future dollar loss from each current executable mark to the worse of its broker-held stop outcome or a conservative correlated/option/gap/halt stress outcome. Define `EXISTING_PENDING_RISK` as the aggregate future dollar loss from every unfilled order's worst reviewed working-limit fill to the worse of its exact stop outcome or conservative stress outcome. Do not use entry-to-stop loss for an already open position: its current P&L is already in current equity. Do not count the same position, order, or tail scenario twice.
- Define `PROPOSED_NEW_RISK` for the exact intended quantity as the greater of loss from the worst reviewed executable fill to the exact structural stop including modeled spread and stop slippage, or the conservative correlated/option/gap/halt stress loss. Define `EXECUTION_RESERVE` as the greater of $5 or the additional aggregate execution uncertainty not already included in those stressed downside values. The loss-lock calculation may offset only the part of open downside covered by positive open P&L that LOSS_GAUGE deliberately did not credit. After the first +$150 crossing, the separate +$125-floor calculation must reserve the full current-mark-to-stop/stress downside because the floor is based on account equity.
- Immediately before every entry or add, after the final quote, stop, quantity, open positions, and working orders are known, perform this sequence in order: obtain and persist one exact fresh Robinhood reconciliation through `risk record`; require the current durable emergency-entry-stop status; obtain a final Robinhood preview for the exact account, instrument, side, quantity, and limit; then compare the preview's account, equity, unleveraged buying power, current gross exposure, working-entry notional, order quantity, and projected cost with the fresh snapshot. Any account or quantity contradiction, negative amount, reviewed notional above preview unleveraged buying power, or projected post-order gross above current equity is an immediate hard block. An absolute preview-versus-snapshot unleveraged-buying-power difference greater than `max($5, 1% of current broker-confirmed equity)` is `BUYING_POWER_MISMATCH`: emit an alert, block new ENTRY, ADD, and reentry, obtain a fresh Robinhood reconciliation, and restart this sequence. Never shrink quantity silently or substitute margin buying power to make the comparison pass.
- Only after that exact preview comparison passes, require this exact command to succeed: `"/Users/harp/Library/Application Support/Titan Momentum/scripts/titan-massive" risk gate --account-key ending-7153 --session-date YYYY-MM-DD --expected-broker-confirmed-at TIMESTAMP --max-age-seconds 90 --entry-check --instrument-key INSTRUMENT_KEY --symbol SYMBOL --direction UP_OR_DOWN --asset-class EQUITY_OR_OPTION --thesis-key THESIS_KEY --risk-action ENTRY_OR_ADD --pilot-id titan_momentum_equity --book-mode LIVE --decision-contract-version titan_momentum_equity_2026-08-23_v1 --decision-contract-hash dba59bd7fb006e5c0ec8fd31fb467076638ba6de9e30442fdc5411449c4d7c21 --reviewed-entry-price WORST_LIMIT_PRICE --structural-stop-price STOP_PRICE --quantity QUANTITY --contract-multiplier MULTIPLIER --modeled-execution-loss-dollars EXECUTION_LOSS --maximum-acceptable-slippage-dollars MAXIMUM_ACCEPTABLE_SLIPPAGE --stress-tail-loss-dollars STRESS_TAIL_LOSS --existing-open-downside-dollars EXISTING_OPEN_DOWNSIDE --existing-pending-risk-dollars EXISTING_PENDING_RISK --execution-reserve-dollars EXECUTION_RESERVE --expected-unleveraged-buying-power-dollars PREVIEW_BP --preview-id PREVIEW_ID --preview-confirmed-at PREVIEW_TIMESTAMP --preview-account-key ending-7153 --preview-instrument-key INSTRUMENT_KEY --preview-side BUY --preview-order-quantity QUANTITY --preview-limit-price WORST_LIMIT_PRICE --preview-equity-dollars PREVIEW_EQUITY --preview-current-gross-exposure-dollars PREVIEW_GROSS --preview-working-entry-notional-dollars PREVIEW_WORKING_ENTRY_NOTIONAL --preview-projected-cost-dollars PREVIEW_PROJECTED_COST --broker-ack-timeout-seconds 10`. Every `--preview-*` value must come unchanged from the single final Robinhood preview; the duplicate account, instrument, quantity, price, equity, exposure, and cost facts must agree exactly with the reviewed order and fresh snapshot. Use multiplier `1` for shares and `100` for options. Supply every numeric value explicitly; never omit a field, silently use zero, or use a placeholder literally—pass exactly `UP` or `DOWN`, `EQUITY` or `OPTION`, and `ENTRY` or `ADD`. The installed gate, not the prompt, must calculate reviewed notional as price times quantity times multiplier and proposed new risk as the greater of stop-defined loss including modeled execution loss or stress/tail loss. It must reject notional above preview unleveraged buying power, projected post-order gross above equity, contradictory Pilot identity, an engaged or changed emergency stop, or a material buying-power mismatch. Require returned `risk_gate_mode=entry_authorization`, `new_entries_allowed=true`, exact current emergency-stop generation and state hash, and `risk_gate_authorization` byte-for-byte equal to `pretrade_risk_facts`; preserve that canonical object in the associated decision and campaign broker evidence. Recompute the preview and rerun this gate if the quote, limit, stop, quantity, notional, position, order, account, buying power, risk snapshot, or emergency-stop generation/hash changes before submission.
- The entry gate must return the one canonical `titan_live_pretrade_risk_facts_2026-08-23_v1` object as part of the authorization; do not independently rebuild or self-hash a second record. It must include the four Pilot identity fields; strategy, account, session, and decision timestamp; broker snapshot hash and timestamp; the preview identifier and timestamp plus its exact account, instrument, BUY side, order quantity, limit, equity, current gross exposure, working-entry notional, and projected cost; equity, unleveraged buying power, current gross and working-entry notional; instrument, symbol, thesis, direction, asset class, ENTRY or ADD, worst reviewed price, structural stop, quantity, multiplier, and maximum acceptable slippage; reviewed notional; stop-defined loss; modeled execution loss; stress/tail loss; maximum contractual loss when defined; proposed new risk; execution reserve; existing open and pending downside; dynamic capacity; projected post-order gross and remaining buying power; account-day loss headroom; emergency-stop generation and state hash; authorization identifier and expiry; the fixed 10-second acknowledgment timeout; and the evaluated `max($5, 1% of current broker-confirmed equity)` buying-power mismatch tolerance. `submission_intent_at` and `broker_ack_deadline_at` must both be null in the initially returned authorization; the submission-intent command must atomically set them once, with the latter exactly 10 seconds after the former, and neither may later change. Preserve the returned authorization and its canonical pretrade facts byte-for-byte with the decision and campaign, including that authorized record's immutable submission-intent enrichment. Missing or nonfinite fields, inconsistent formulas, `book_mode` other than `LIVE`, or a Pilot/contract mismatch blocks submission.
